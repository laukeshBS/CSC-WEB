<div class="container mt-5 text-center">

  <h3>
    Redirecting To Payment Gateway...
  </h3>

  <div *ngIf="loading">
    Please wait...
  </div>

  <!-- ===================================== -->
  <!-- PayU Payment Form -->
  <!-- ===================================== -->

  <form
  #payuForm
  method="post"
  [action]="action"
  accept-charset="UTF-8"
>

  <input
    type="hidden"
    name="key"
    [value]="MERCHANT_KEY"
  >

  <input
    type="hidden"
    name="txnid"
    [value]="txnid"
  >

  <input
    type="hidden"
    name="amount"
    [value]="amount"
  >

  <input
    type="hidden"
    name="productinfo"
    [value]="orderID"
  >

  <input
    type="hidden"
    name="firstname"
    [value]="firstname"
  >

  <input
    type="hidden"
    name="email"
    [value]="email"
  >

  <input
    type="hidden"
    name="phone"
    [value]="phone"
  >

  <input
    type="hidden"
    name="surl"
    [value]="surl"
  >

  <input
    type="hidden"
    name="furl"
    [value]="furl"
  >

  <input
    type="hidden"
    name="hash"
    [value]="hash"
  >

  <input
    type="hidden"
    name="service_provider"
    value="payu_paisa"
  >

</form>

</div>
