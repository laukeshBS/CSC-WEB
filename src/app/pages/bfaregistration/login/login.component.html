
<div class="bfa-login-container">
  <h1>BFA Login</h1>

  <nav class="bfa-nav">
    <button (click)="showFirstTime()" [class.active]="view==='first'">First-time login</button>
    <button (click)="showRegular()" [class.active]="view==='regular'">Regular login</button>
  </nav>

  <section *ngIf="view === 'first'" class="card">
    <h2>First-time login</h2>

    <!-- Step 1: Forgot Password (enter mobile or PAN to request reset) -->
    <div *ngIf="ftStep === 1">
      <p>Click <a href="#" (click)="gotoForgot($event)">Forgot Password</a> to start reset using PAN.</p>
    </div>

    <!-- Step 2: Reset using PAN -->
    <form [formGroup]="panForm" *ngIf="ftStep === 2" (ngSubmit)="submitPan()" class="form">
      <label for="pan">PAN Number</label>
      <input id="pan" formControlName="pan" maxlength="10" placeholder="Enter PAN" />
      <div *ngIf="panForm.get('pan')?.touched && panForm.get('pan')?.invalid" class="error">
        PAN is required and must be 10 characters.
      </div>

      <button type="submit" [disabled]="panForm.invalid">Reset</button>
      <button type="button" (click)="cancelFirstTime()">Cancel</button>
    </form>

    <!-- Step 3: Set PIN -->
    <form [formGroup]="pinForm" *ngIf="ftStep === 3" (ngSubmit)="setPin()" class="form">
      <label for="pin">Set PIN (4-6 digits)</label>
      <input id="pin" formControlName="pin" maxlength="6" inputmode="numeric" />
      <label for="pinConfirm">Confirm PIN</label>
      <input id="pinConfirm" formControlName="pinConfirm" maxlength="6" inputmode="numeric" />

      <div *ngIf="pinError" class="error">{{ pinError }}</div>

      <button type="submit" [disabled]="pinForm.invalid">Set PIN</button>
    </form>

    <div *ngIf="ftMessage" class="message">{{ ftMessage }}</div>
  </section>

  <section *ngIf="view === 'regular'" class="card">
    <h2>Regular login</h2>

    <form [formGroup]="loginForm" (ngSubmit)="login()" class="form">
      <label for="mobile">Mobile</label>
      <input id="mobile" formControlName="mobile" placeholder="Enter mobile" />

      <div class="otp-row">
        <label>OTP (valid once per day)</label>
        <div class="otp-controls">
          <input id="otp" formControlName="otp" maxlength="6" />
          <button type="button" (click)="sendOtp()" [disabled]="otpSent">Send OTP</button>
        </div>
      </div>

      <label for="pinLogin">PIN</label>
      <input id="pinLogin" formControlName="pinLogin" maxlength="6" inputmode="numeric" />

      <div *ngIf="loginError" class="error">{{ loginError }}</div>

      <button type="submit" [disabled]="loginForm.invalid">Login</button>

      <p class="muted">Note: OTP required once per day; PIN required every login.</p>
    </form>
  </section>
</div>
